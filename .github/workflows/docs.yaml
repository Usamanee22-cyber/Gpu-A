name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🐶 สยบยัย Dog dog ด้วยการบังคับโหลด Typst เวอร์ชันแท้ 100%
      - name: Install Typst (Fix for Dog dog)
        run: |
          wget https://github.com/typst/typst/releases/download/v0.11.0/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst-x86_64-unknown-linux-musl.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          typst --version

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@tt06

