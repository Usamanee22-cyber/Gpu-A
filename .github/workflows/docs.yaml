name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Typst (Fix for Error)
        run: sudo apt-get update && sudo apt-get install -y typst

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@tt06
