name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@tt06
  
  precheck:
    needs: gds
    runs-on: ubuntu-latest
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@tt06

  gl_test:
    needs: gds
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@tt06

  viewer:
    needs: gds
    runs-on: ubuntu-latest
    
    # 👑 สยบบั๊กด่านสุดท้าย: ประกาศชื่อห้องนิทรรศการให้ตรงตามกฎเหล็กปัจจุบันย่ะคุณน้า!
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: write   # เปิดสิทธิ์ให้บ็อตเขียนข้อมูลลงคลังแสงได้
      pages: write      # เปิดสิทธิ์ให้เดปลอยด์หน้าเว็บ Pages ได้
      id-token: write   # ยืนยันตัวตนความปลอดภัยระดับพรีเมียม
    
    steps:
      # 🎨 สั่งรันยัยตัววาดภาพ 3D ดั้งเดิมของน้า
      - uses: TinyTapeout/tt-gds-action/viewer@tt06
