# Tiny Tapeout project information
project:
  title:        "AI GPU Mega Core 16Bit"      # ชื่อโปรเจกต์ตัวแม่
  author:       "คุณน้าประธานบอร์ดบริหาร"      # ใส่ชื่อน้าลงไปได้เลยจ้า
  discord:      ""      
  description:  "16-Bit AI Matrix Engine with GPU VGA Raster Signal Pipeline"      
  language:     "Verilog" 
  clock_hz:     10000000       # วิ่งความถี่กระฉูด 10 MHz ไปเลยย่ะ

  # ขนาดพื้นที่ชิปยักษ์ตัวแม่ (ถ้าโค้ดใหญ่ แนะนำใช้ 1x2 หรือ 2x2 ย่ะ)
  tiles: "1x1"          

  # เปลี่ยนชื่อ Top Module ให้ตรงตามหน้ากากครอบพอร์ตที่เราเย็บใหม่ด้านบน
  top_module:  "tt_um_ai_gpu_core"
  
  source_files:        
    - "project.v"

# การแมปขาพินจับคู่แต่งงาน (สยบปัญหาตัว I หรือตัว l เรียบร้อยย่ะ)
pinout:
  # Inputs (ขาเข้าหลักควบคุมโดยบอร์ด)
  ui[0]: "Master Clock input"
  ui[1]: "Global Reset (Active Low)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (ขาออกพ่นกราฟิกขึ้นจอ)
  uo[0]: "Horizontal Sync (H-SYNC)"
  uo[1]: "Vertical Sync (V-SYNC)"
  uo[2]: "Display Data Valid Signal"
  uo[3]: "Pixel Color Bit 3"
  uo[4]: "Pixel Color Bit 4"
  uo[5]: "Pixel Color Bit 5"
  uo[6]: "Pixel Color Bit 6"
  uo[7]: "Pixel Color Bit 7"

  # Bidirectional pins (ขาออกสำหรับดูผลคำนวณข้อมูล AI 16 บิตซอยย่อย)
  uio[0]: "Core Data Output Bit 0"
  uio[1]: "Core Data Output Bit 1"
  uio[2]: "Core Data Output Bit 2"
  uio[3]: "Core Data Output Bit 3"
  uio[4]: "Core Data Output Bit 4"
  uio[5]: "Core Data Output Bit 5"
  uio[6]: "Core Data Output Bit 6"
  uio[7]: "Core Data Output Bit 7"

# Do not change!
yaml_version: 6
