# Tiny Tapeout project information
project:
  title:        "Ultimate AI GPU MegaCore 16Bit"      # ชื่อโปรเจกต์สุดอลังการของคุณน้า
  author:       "The Ultimate CEO"                    # ใส่ชื่อคุณน้าตรงนี้ได้เลยย่ะ
  discord:      ""                                    # เว้นว่างไว้ได้จ้า
  description:  "16-Bit GPU Core with Embedded DLSS AI Super Resolution Engine" # คำอธิบายความปัง
  language:     "Verilog" 
  clock_hz:     10000000       # สั่งวิ่งความเร็วนาฬิกา 10 MHz นิ่มๆ ไอแพดไม่ล่ม

  # เนื่องจากโค้ดใหญ่โตมหึมามาก ป้าขยับพื้นที่ชิปให้เป็น 1x2 (ใหญ่ขึ้นเท่าตัว) จะได้ไม่เบียดกันย่ะ!
  tiles: "1x2"          

  # ชื่อโมดูลหลักตัวแม่ที่ป้าตั้งค่าให้ระบบตามหาตัวเจอ:
  top_module:  "AI_GPU_Mega_Core_16Bit"
  
  # รายชื่อไฟล์โค้ด (.v) ที่ระบบต้องดึงไปหลอม:
  source_files:        
    - "project.v"

# การผูกสายไฟอินพุตและเอาต์พุต (Pinout) แมปเข้ากับโค้ด 16 บิตของคุณน้าเป๊ะๆ ย่ะ:
pinout:
  # ขาเข้า (Inputs)
  ui[0]: "clk"                # สัญญาณนาฬิกาหลัก
  ui[1]: "rst"                # ปุ่มรีเซ็ตระบบ
  ui[2]: "video_in_pixel[0]"  # บิตพิกเซลภาพขาเข้า
  ui[3]: "video_in_pixel[1]"
  ui[4]: "video_in_pixel[2]"
  ui[5]: "video_in_pixel[3]"
  ui[6]: "ai_mode_control[0]" # ขาควบคุมโหมดสั่งเปิด-ปิด AI
  ui[7]: "ai_mode_control[1]"

  # ขาออก (Outputs)
  uo[0]: "h_sync_signal"      # สัญญาณยิงภาพแนวนอน
  uo[1]: "v_sync_signal"      # สัญญาณยิงภาพแนวตั้ง
  uo[2]: "final_rgb_r[0]"     # สัญญาณสีแดงตัวแม่
  uo[3]: "final_rgb_r[1]"
  uo[4]: "final_rgb_g[0]"     # สัญญาณสีเขียวตัวแม่
  uo[5]: "final_rgb_g[1]"
  uo[6]: "final_rgb_b[0]"     # สัญญาณสีน้ำเงินตัวแม่
  uo[7]: "ai_process_ready"   # ไฟสถานะบอกว่า AI ประมวลผลภาพคมชัดเสร็จแล้ว

  # ขาสองทิศทาง (Bidirectional) เว้นว่างไว้ตามกฎเหล็กย่ะ
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
